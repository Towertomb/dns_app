# Local Minikube: preload lab3-as/fs/us:latest.
# Cloud: replace image names with your published registry image references.
# Requires a default StorageClass for the AS persistent volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: as-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab3-as
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lab3-as
  template:
    metadata:
      labels:
        app: lab3-as
    spec:
      containers:
      - name: as
        image: lab3-as:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 53533
          protocol: UDP
        env:
        - name: DNS_RECORD_FILE
          value: /data/records.json
        volumeMounts:
        - name: records
          mountPath: /data
      volumes:
      - name: records
        persistentVolumeClaim:
          claimName: as-data
---
apiVersion: v1
kind: Service
metadata:
  name: lab3-as
spec:
  type: NodePort
  selector:
    app: lab3-as
  ports:
  - name: as
    port: 53533
    targetPort: 53533
    nodePort: 30001
    protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab3-fs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lab3-fs
  template:
    metadata:
      labels:
        app: lab3-fs
    spec:
      containers:
      - name: fs
        image: lab3-fs:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 9090
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lab3-fs
spec:
  type: NodePort
  selector:
    app: lab3-fs
  ports:
  - name: fs
    port: 9090
    targetPort: 9090
    nodePort: 30002
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab3-us
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lab3-us
  template:
    metadata:
      labels:
        app: lab3-us
    spec:
      containers:
      - name: us
        image: lab3-us:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lab3-us
spec:
  type: NodePort
  selector:
    app: lab3-us
  ports:
  - name: us
    port: 8080
    targetPort: 8080
    nodePort: 30003
    protocol: TCP
